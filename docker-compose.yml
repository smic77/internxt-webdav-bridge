services:
  internxt-webdav:
    image: ghcr.io/smic77/internxt-webdav-bridge:latest
    container_name: internxt-webdav
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Paris
      - WEBDAV_USERNAME=admin
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-changeme}
      - INTERNXT_CREDENTIALS_FILE=/credentials/credentials.json
      # Vérification du jeton Internxt (secondes) ; renouvelé à mi-vie
      - INTERNXT_TOKEN_CHECK_INTERVAL=3600
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Lecture-écriture : le jeton renouvelé est réenregistré dans ce fichier
      - /home/sebastien/.internxt-tools/credentials.json:/credentials/credentials.json:rw
    # healthcheck: défini dans le Dockerfile (PROPFIND authentifié)

