services:
  internxt-webdav:
    image: ghcr.io/smic77/internxt-webdav-bridge:latest
    container_name: internxt-webdav
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Paris
      - WEBDAV_USERNAME=admin
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-changeme}
      - INTERNXT_CREDENTIALS_FILE=/run/secrets/internxt_credentials
    secrets:
      - internxt_credentials
    volumes:
      - /etc/localtime:/etc/localtime:ro
    # healthcheck: défini dans le Dockerfile (PROPFIND authentifié)

secrets:
  internxt_credentials:
    file: /home/sebastien/.internxt-tools/credentials.json
